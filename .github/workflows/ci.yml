name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, always-on: the repo verifies itself (checksums, syntax, no secrets).
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/check_sources.py

  # Fast, always-on: the patch series must apply cleanly to the pinned
  # upstream Omarchy commit recorded in the root PKGBUILD.
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the pinned upstream commit
        run: echo "OMARCHY_COMMIT=$(grep -oP '(?<=^_commit=)[0-9a-f]{40}' PKGBUILD)" >> "$GITHUB_ENV"
      - name: Fetch upstream Omarchy at the pinned commit
        run: |
          git init upstream
          cd upstream
          git remote add origin https://github.com/omacom/omarchy.git
          git fetch --depth 1 origin "$OMARCHY_COMMIT"
          git checkout -q FETCH_HEAD
      - name: Apply the patch series like the PKGBUILD does
        working-directory: upstream
        run: |
          set -euo pipefail
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            patch -Np1 --fuzz=0 --dry-run -i "$p"
            patch -Np1 --fuzz=0 -i "$p"
            echo "applied $(basename "$p")"
          done
      - name: Verify the patched tree
        run: |
          set -euo pipefail
          test -f upstream/bin/omarchy-hw-aarch64-lmi
          bash -n upstream/bin/omarchy-hw-aarch64-lmi
          ! grep -ri apollo upstream/bin upstream/shell upstream/test upstream/config

  # Slow, on demand only (workflow_dispatch): cross-build the aarch64 kernel
  # payload. The first run also records the source-tarball sha512 so the pin
  # in build-kernel.sh can be filled from a recorded value.
  kernel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Resolve the pinned kernel commit
        run: |
          echo "KERNEL_COMMIT=$(grep -oP '(?<=^COMMIT=)[0-9a-f]{40}' \
            repo/hardware/lmi-base/port-source/linux-lmi/build-kernel.sh)" >> "$GITHUB_ENV"
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld gcc flex bison bc cpio dwarves libelf-dev libssl-dev
      - name: Download the kernel tarball and record its sha512
        run: |
          mkdir -p build/downloads
          curl --fail --location --retry 3 \
            --output "build/downloads/linux-$KERNEL_COMMIT.tar.gz" \
            "https://github.com/yuweiyuan8/linux/archive/$KERNEL_COMMIT.tar.gz"
          sha512sum "build/downloads/linux-$KERNEL_COMMIT.tar.gz" | tee linux-tarball.sha512
      - name: Cross-build Image.gz, DTB and modules
        run: |
          set -euo pipefail
          export LMI_REPO="$GITHUB_WORKSPACE/repo"
          export LMI_BUILD="$GITHUB_WORKSPACE/build"
          export LMI_JOBS="$(nproc)"
          export LMI_TARBALL_SHA512="$(awk '{print $1}' linux-tarball.sha512)"
          "$LMI_REPO/hardware/lmi-base/port-source/linux-lmi/build-kernel.sh"
      - name: Package the kernel assets tarball
        run: |
          set -euo pipefail
          ver=$(grep -oP '(?<=^pkgver=).*' repo/hardware/lmi-base/port-source/linux-lmi/PKGBUILD)
          rel=$(grep -oP '(?<=^pkgrel=).*' repo/hardware/lmi-base/port-source/linux-lmi/PKGBUILD)
          name="lmi-kernel-assets-$ver-$rel"
          work="$(mktemp -d)"
          mkdir -p "$work/$name/assets/boot/lmi" "$work/$name/assets/lib/modules"
          cp build/artifacts/Image.gz build/artifacts/sm8250-xiaomi-lmi.dtb "$work/$name/assets/boot/lmi/"
          cp build/kernel-out/.config "$work/$name/assets/boot/lmi/config"
          cp -a build/artifacts/lib/modules/* "$work/$name/assets/lib/modules/"
          cp "build/linux-$KERNEL_COMMIT/COPYING" "$work/$name/assets/COPYING"
          # depmod regenerates these on the target; the package recipe excludes them.
          find "$work/$name/assets/lib/modules" -type l \( -name build -o -name source \) -delete
          tar -cJf "$name.tar.xz" -C "$work" "$name"
          sha512sum "$name.tar.xz" | tee lmi-kernel-assets.sha512
      - name: Upload the boot payload
        uses: actions/upload-artifact@v4
        with:
          name: lmi-kernel-artifacts
          path: |
            build/artifacts/
            linux-tarball.sha512
            lmi-kernel-assets.sha512
            lmi-kernel-assets-*.tar.xz
          if-no-files-found: error

  # On demand, after the kernel job: assemble the boot initramfs and an
  # Android boot image, then round-trip the header. The base SquashFS is a
  # FIXTURE: the real rootfs and its private firmware inputs never enter CI.
  # A fixture boot image boots, fails the init's own checks ('systemd
  # missing') and reboots to the bootloader; it is a pipeline test, not an
  # installation image.
  bootimage:
    if: github.event_name == 'workflow_dispatch'
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download the kernel payload
        uses: actions/download-artifact@v4
        with:
          name: lmi-kernel-artifacts
          path: kernel
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross cpio gzip squashfs-tools
      - name: Fetch mkbootimg at the pinned commit
        run: |
          git init mkbootimg
          cd mkbootimg
          git remote add origin https://android.googlesource.com/platform/system/tools/mkbootimg
          git fetch --depth 1 origin d2bb0af5ba6d3198a3e99529c97eda1be0b5a093
          git checkout -q FETCH_HEAD
      - name: Build the pinned busybox
        run: |
          set -euo pipefail
          export BUSYBOX_VER=1.37.0
          export BUSYBOX_BUILD="$PWD/build/busybox"
          mkdir -p "$BUSYBOX_BUILD/downloads"
          curl --fail --location --retry 3 \
            --output "$BUSYBOX_BUILD/downloads/busybox-$BUSYBOX_VER.tar.bz2" \
            "https://busybox.net/downloads/busybox-$BUSYBOX_VER.tar.bz2"
          sha512sum "$BUSYBOX_BUILD/downloads/busybox-$BUSYBOX_VER.tar.bz2" | tee busybox.sha512
          export BUSYBOX_SHA512="$(awk '{print $1}' busybox.sha512)"
          "$GITHUB_WORKSPACE/hardware/lmi-base/system/build-busybox.sh"
      - name: Assemble a fixture base and the boot image
        run: |
          set -euo pipefail
          export BUSYBOX_SHA512="$(awk '{print $1}' busybox.sha512)"
          export BUSYBOX_BUILD="$PWD/build/busybox"
          export BUSYBOX_VER=1.37.0
          fdir=$(mktemp -d)
          mkdir -p "$fdir/root"
          chmod 0755 "$fdir/root"
          printf 'omarchy-lmi-slot-v1\n' > "$fdir/root/.omarchy-slot-v1"
          mksquashfs "$fdir/root" "$fdir/base.sqfs" -noappend -comp zstd >/dev/null
          "$GITHUB_WORKSPACE/hardware/lmi-base/system/build-initramfs.sh" \
            --repo "$GITHUB_WORKSPACE" \
            --slot ci-fixture \
            --base-squashfs "$fdir/base.sqfs" \
            --busybox "$BUSYBOX_BUILD/busybox-$BUSYBOX_VER/busybox" \
            --output build/initramfs-ci-fixture.img
          "$GITHUB_WORKSPACE/hardware/lmi-base/system/build-bootimg.sh" \
            --kernel kernel/build/artifacts/Image.gz \
            --dtb kernel/build/artifacts/sm8250-xiaomi-lmi.dtb \
            --ramdisk build/initramfs-ci-fixture.img \
            --mkbootimg mkbootimg/mkbootimg.py \
            --output build/boot-ci-fixture.img
      - name: Round-trip the boot image header
        run: |
          set -euo pipefail
          python3 mkbootimg/unpack_bootimg.py \
            --boot_img build/boot-ci-fixture.img --out unpacked --format mkbootimg \
            | tee unpacked-args
          test -f unpacked/kernel
          test -f unpacked/ramdisk
          test -f unpacked/dtb
          grep -q -- '--header_version 2' unpacked-args
          grep -q -- '--pagesize 0x00001000' unpacked-args
          grep -q -- '--base 0x00000000' unpacked-args
          grep -q 'console=ttyMSM0,115200n8' unpacked-args
          grep -q 'androidboot.hardware=qcom' unpacked-args
          grep -q 'reboot=panic_warm' unpacked-args
          grep -q -- '--dtb' unpacked-args
      - name: Upload the fixture boot image
        uses: actions/upload-artifact@v4
        with:
          name: lmi-bootimage-fixture
          path: |
            build/boot-ci-fixture.img
            build/initramfs-ci-fixture.img
            busybox.sha512
          if-no-files-found: error

  # Slow, on demand only: build the public package set and the real base rootfs
  # on a native arm64 runner, then the initramfs and boot image around it. The
  # device-private packages (lmi-dsp, lmi-modem) are not built here; they need
  # inputs from the owner's phone and are installed locally afterwards.
  rootfs:
    if: github.event_name == 'workflow_dispatch'
    needs: kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet || true
          docker system prune -af >/dev/null || true
          df -h /
      - name: Download the kernel payload
        uses: actions/download-artifact@v4
        with:
          name: lmi-kernel-artifacts
          path: kernel
      - name: Import the verified Arch Linux ARM bootstrap
        run: hardware/lmi-base/system/ci/bootstrap-alarm.sh
      - name: Build the builder image
        run: docker build --platform linux/arm64 -t lmi-builder hardware/lmi-base/system/ci
      - name: Stage the build inputs
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/work"
          mkdir -p "$W/src" "$W/pkgs" "$W/out"
          git ls-files -z | xargs -0 -I{} cp --parents {} "$W/src/"
          # The community firmware set is public; the archive mode bits depend
          # on umask, so assemble under the umask the pin was computed with.
          mkdir -p "$W/src/private-inputs"
          (umask 022; packaging/firmware-model/assemble-firmware.sh \
            --output "$W/src/private-inputs/firmware-xiaomi-lmi-0.1.tar.gz")
          # The kernel assets archive is not byte-reproducible between runs, so
          # the staged copy pins the archive this run just built.
          assets=kernel/lmi-kernel-assets-*.tar.xz
          cp $assets "$W/src/hardware/lmi-base/port-source/linux-lmi/"
          sum=$(sha512sum $assets | cut -d' ' -f1)
          sed -i "s/^sha512sums=('[0-9a-f]*')/sha512sums=('$sum')/" \
            "$W/src/hardware/lmi-base/port-source/linux-lmi/PKGBUILD"
          # Keyring sources at a pinned omarchy-pkgs commit (sha512-checked by its PKGBUILD).
          git init -q "$W/omarchy-pkgs"
          git -C "$W/omarchy-pkgs" remote add origin https://github.com/omacom/omarchy-pkgs
          git -C "$W/omarchy-pkgs" fetch -q --depth 1 origin ae6fe3f090844c8fdbfdd0b86e4121602302fab4
          git -C "$W/omarchy-pkgs" checkout -q FETCH_HEAD
          echo "WORK=$W" >> "$GITHUB_ENV"
      - name: Build the packages and the base rootfs
        run: |
          docker run --rm --privileged --platform linux/arm64 \
            -v "$WORK:/work" lmi-builder /work/src/hardware/lmi-base/system/ci/in-container.sh
          sudo chown -R "$USER" "$WORK/out"
          ls -lh "$WORK/out"
      - name: Fetch mkbootimg at the pinned commit
        run: |
          git init mkbootimg
          cd mkbootimg
          git remote add origin https://android.googlesource.com/platform/system/tools/mkbootimg
          git fetch --depth 1 origin d2bb0af5ba6d3198a3e99529c97eda1be0b5a093
          git checkout -q FETCH_HEAD
      - name: Build the pinned busybox
        run: |
          set -euo pipefail
          export BUSYBOX_VER=1.37.0
          export BUSYBOX_BUILD="$PWD/build/busybox"
          mkdir -p "$BUSYBOX_BUILD/downloads"
          curl --fail --location --retry 3 \
            --output "$BUSYBOX_BUILD/downloads/busybox-$BUSYBOX_VER.tar.bz2" \
            "https://busybox.net/downloads/busybox-$BUSYBOX_VER.tar.bz2"
          sha512sum "$BUSYBOX_BUILD/downloads/busybox-$BUSYBOX_VER.tar.bz2" | tee busybox.sha512
          export BUSYBOX_SHA512="$(awk '{print $1}' busybox.sha512)"
          CROSS_COMPILE= "$GITHUB_WORKSPACE/hardware/lmi-base/system/build-busybox.sh"
      - name: Assemble the initramfs and the boot image
        run: |
          set -euo pipefail
          export BUSYBOX_SHA512="$(awk '{print $1}' busybox.sha512)"
          export BUSYBOX_BUILD="$PWD/build/busybox"
          export BUSYBOX_VER=1.37.0
          hardware/lmi-base/system/build-initramfs.sh \
            --repo "$GITHUB_WORKSPACE" \
            --slot lmi-ci \
            --base-squashfs "$WORK/out/omarchy-lmi.sqfs" \
            --busybox "$BUSYBOX_BUILD/busybox-$BUSYBOX_VER/busybox" \
            --host-cc gcc \
            --output build/initramfs.img
          hardware/lmi-base/system/build-bootimg.sh \
            --kernel kernel/build/artifacts/Image.gz \
            --dtb kernel/build/artifacts/sm8250-xiaomi-lmi.dtb \
            --ramdisk build/initramfs.img \
            --mkbootimg mkbootimg/mkbootimg.py \
            --output build/boot.img
          sha256sum "$WORK/out/omarchy-lmi.sqfs" build/boot.img build/initramfs.img | tee build/SHA256SUMS
      - name: Round-trip the boot image header
        run: |
          set -euo pipefail
          python3 mkbootimg/unpack_bootimg.py \
            --boot_img build/boot.img --out unpacked --format mkbootimg | tee unpacked-args
          grep -q -- '--header_version 2' unpacked-args
          grep -q -- '--pagesize 0x00001000' unpacked-args
          grep -q 'console=ttyMSM0,115200n8' unpacked-args
      - name: Upload the image set
        uses: actions/upload-artifact@v4
        with:
          name: lmi-rootfs
          path: |
            ${{ env.WORK }}/out/omarchy-lmi.sqfs
            ${{ env.WORK }}/pkgs/*.pkg.tar.*
            build/boot.img
            build/initramfs.img
            build/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
